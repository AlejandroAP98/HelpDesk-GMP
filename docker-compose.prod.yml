# =============================================================================
# Override de PRODUCCIÓN (Linux server en LAN)
# =============================================================================
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d --build
#
# Características:
#   - Caddy activo como reverse proxy con TLS auto-firmado (CA interna)
#   - Sin hot-reload: imágenes multi-stage optimizadas
#   - restart: always en todos los servicios
#   - Logs limitados para no llenar disco
#   - Hostname del servidor resuelto por mDNS (avahi-daemon)
# =============================================================================

services:
  postgres:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    restart: always
    command: ["poetry", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      APP_ENV: prod
      LOG_LEVEL: INFO
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  scheduler:
    restart: always
    environment:
      APP_ENV: prod
      LOG_LEVEL: INFO
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://helpdesk.local/api
        NEXT_PUBLIC_WS_URL: wss://helpdesk.local/ws
    restart: always
    command: ["node", "server.js"]
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    env_file:
      - .env
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"