[tool.poetry]
name = "helpdesk-gmp-backend"
version = "0.1.0"
description = "Backend FastAPI del sistema HelpDesk-GMP (multi-tenant)"
authors = ["HelpDesk-GMP <devox@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.29.0"
alembic = "^1.13.3"
pydantic = { extras = ["email"], version = "^2.9.2" }
pydantic-settings = "^2.5.2"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
bcrypt = "^4.2.0"
python-multipart = "^0.0.12"
redis = { extras = ["hiredis"], version = "^5.1.1" }
boto3 = "^1.35.40"          # Cliente S3 (compatible con MinIO)
apscheduler = "^3.10.4"
httpx = "^0.27.2"
psycopg2-binary = "^2.9.9"  # Sincrono, usado por Alembic

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
ruff = "^0.6.9"
mypy = "^1.11.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]