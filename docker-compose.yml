# =============================================================================
# HelpDesk-GMP - docker-compose base (compartido por dev y prod)
# =============================================================================
# Este archivo define el stack completo. NO se ejecuta directamente; se combina
# con un override:
#   Dev : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

name: helpdesk-gmp

networks:
  internal:
    driver: bridge
    internal: false   # Caddy necesita salir a LAN; el resto se aísla por no exponer puertos
  proxy:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 con extensión pgcrypto (para gen_random_uuid())
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helpdesk} -d ${POSTGRES_DB:-helpdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No se publica el puerto al host ( política "conectarse dentro de Docker")

  # ---------------------------------------------------------------------------
  # Redis 7 (caché + Pub/Sub para WebSockets)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO (almacenamiento S3-compatible para adjuntos)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-helpdesk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-helpdesk12345}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend FastAPI (API REST + WebSockets)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
      - proxy
    # El puerto se publica solo en dev (override). En prod va detrás de Caddy.

  # ---------------------------------------------------------------------------
  # Scheduler (APScheduler en proceso separado)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: ./scheduler
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Frontend Next.js
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      - backend
    networks:
      - internal
      - proxy
    # El puerto se publica solo en dev (override). En prod va detrás de Caddy.

  # ---------------------------------------------------------------------------
  # Caddy reverse proxy (solo activo en prod via override)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
      - proxy
    depends_on:
      - frontend
      - backend
    profiles:
      - prod   # Solo arranca en prod (el override activa este profile)

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel (cloudflared) - expone Caddy a internet sin abrir puertos
  # Solo activo en prod via override. Conexion OUTBOUND a Cloudflare, no publica
  # puertos en el host. Requiere CLOUDFLARE_TUNNEL_TOKEN en .env.
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal
      - proxy
    depends_on:
      - caddy
    profiles:
      - prod